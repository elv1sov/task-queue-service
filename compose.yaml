services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: task_queue
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskuser -d task_queue"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://taskuser:${POSTGRES_PASSWORD}@postgres:5432/task_queue?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    build: .
    command: ["./worker"]
    environment:
      DATABASE_URL: postgresql://taskuser:${POSTGRES_PASSWORD}@postgres:5432/task_queue?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data: